name: Qwen3 4B Production Validation

on:
  push:
    branches:
      - engineering/qwen3-4b-production-validation
    paths:
      - '.github/workflows/qwen3-4b-production-validation.yml'
      - 'engineering/model_validation/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-model:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      LLAMA_CPP_REF: b10069
      MODEL_URL: https://huggingface.co/Qwen/Qwen3-4B-GGUF/resolve/main/Qwen3-4B-Q4_K_M.gguf?download=true
      MODEL_FILE: Qwen3-4B-Q4_K_M.gguf
      MODEL_SHA256: 7485fe6f11af29433bc51cab58009521f205840f5b4ae3a32fa7f92e8534fdf5
      CDKGENAI_AI_URL: http://127.0.0.1:8080/v1/chat/completions
      CDKGENAI_MODEL: qwen3-4b
      CDKGENAI_VALIDATION_OUT: validation-results

    steps:
      - name: Check out public validation assets
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build curl ca-certificates jq

      - name: Build pinned llama.cpp server
        run: |
          git clone --depth 1 --branch "${LLAMA_CPP_REF}" https://github.com/ggml-org/llama.cpp.git
          cmake -S llama.cpp -B llama.cpp/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=ON \
            -DLLAMA_CURL=OFF
          cmake --build llama.cpp/build --target llama-server --parallel 2
          ./llama.cpp/build/bin/llama-server --version

      - name: Download official Apache-2.0 model
        run: |
          mkdir -p model
          curl --fail --location --retry 8 --retry-all-errors --continue-at - \
            --output "model/${MODEL_FILE}" "${MODEL_URL}"
          echo "${MODEL_SHA256}  model/${MODEL_FILE}" | sha256sum --check --strict
          ls -lh "model/${MODEL_FILE}"

      - name: Start local model server
        run: |
          ./llama.cpp/build/bin/llama-server \
            --model "model/${MODEL_FILE}" \
            --host 127.0.0.1 \
            --port 8080 \
            --ctx-size 8192 \
            --threads 4 \
            --parallel 1 \
            --batch-size 256 \
            --ubatch-size 128 \
            --mlock 0 \
            --log-file llama-server.log &
          echo $! > llama-server.pid
          for attempt in $(seq 1 120); do
            if curl --silent --fail http://127.0.0.1:8080/health | jq -e '.status == "ok"' >/dev/null 2>&1; then
              echo "llama.cpp server is ready"
              exit 0
            fi
            sleep 2
          done
          cat llama-server.log || true
          exit 1

      - name: Run real CDKGenAI workflow validation
        run: python3 engineering/model_validation/validate_qwen3_4b.py

      - name: Record runtime and model evidence
        if: always()
        run: |
          mkdir -p validation-results
          {
            echo "llama_cpp_ref=${LLAMA_CPP_REF}"
            echo "model_file=${MODEL_FILE}"
            echo "model_sha256=${MODEL_SHA256}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            uname -a
            free -h
          } > validation-results/runtime-evidence.txt
          cp llama-server.log validation-results/llama-server.log 2>/dev/null || true

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-4b-production-validation
          path: validation-results/
          if-no-files-found: error
          retention-days: 14

      - name: Stop local model server
        if: always()
        run: |
          if [ -f llama-server.pid ]; then
            kill "$(cat llama-server.pid)" 2>/dev/null || true
          fi
